services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabitmq-demo
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      # The built-in guest user refuses connections from outside the container.
      RABBITMQ_DEFAULT_USER: demo
      RABBITMQ_DEFAULT_PASS: demo
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 20s

volumes:
  rabbitmq_data:
